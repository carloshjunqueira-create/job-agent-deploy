name: Buscar vagas

on:
  schedule:
    # 09:00 e 19:00 no horario de Brasilia (UTC-3)
    - cron: "0 12 * * 1-5"
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      extra_queries:
        description: "Termos extras para esta busca (separados por ponto e virgula)"
        required: false
        default: ""
      profile:
        description: "ID do perfil de busca (vazio = perfil ativo em config/search-profiles.json)"
        required: false
        default: ""
      skip_ai:
        description: "Rodar sem a IA (so score deterministico)"
        type: boolean
        required: false
        default: false

concurrency:
  group: coleta-de-vagas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auto-teste da logica de triagem
        run: node pipeline/check.mjs

      - name: Coletar, pontuar e montar o feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          EXTRA_QUERIES: ${{ inputs.extra_queries }}
          SEARCH_PROFILE: ${{ inputs.profile }}
          DISABLE_AI: ${{ inputs.skip_ai == true && '1' || '0' }}
        run: node pipeline/collect.mjs

      - name: Resumo da rodada
        if: always()
        run: |
          if [ -f data/last-run.json ]; then
            node -e '
              const r = require("./data/last-run.json");
              const out = [];
              out.push("## Rodada de busca", "");
              out.push("| Etapa | Vagas |", "|---|---|");
              for (const [k, v] of Object.entries(r.counts)) out.push(`| ${k} | ${v} |`);
              out.push("", "| Fonte | Status | Vagas | Detalhe |", "|---|---|---|---|");
              for (const s of r.sources) out.push(`| ${s.label} | ${s.status} | ${s.jobs} | ${(s.detail || "").slice(0, 120)} |`);
              out.push("");
              out.push(`IA: ${r.ai.enabled ? r.ai.model : "desligada"} | tokens entrada ${r.ai.input_tokens || 0} | saida ${r.ai.output_tokens || 0}`);
              out.push("", `Mix por regiao: ${JSON.stringify(r.mix)}`);
              if (Object.keys(r.blocked_reasons || {}).length) out.push("", `Descartes: ${JSON.stringify(r.blocked_reasons)}`);
              console.log(out.join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar o feed no repositorio
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca no feed."
          else
            git commit -m "feed: rodada automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi
